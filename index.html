<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#1f6f5c">
<meta name="referrer" content="no-referrer">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Арабский помощник</title>
<style>
  :root { --g:#1f6f5c; --g2:#e7f3ef; --t:#1d2b27; --m:#66756f; --b:#d8e3df; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:#f6f8f7; color:var(--t); font-size:18px; }
  header { background:var(--g); color:#fff; padding:16px 18px; font-size:22px; font-weight:700; }
  main { padding:14px; max-width:640px; margin:0 auto; }
  .card { background:#fff; border:1px solid var(--b); border-radius:16px; padding:16px; margin-bottom:14px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; }
  button, .btn { flex:1 1 140px; border:0; border-radius:14px; padding:16px 12px; font-size:19px; font-weight:600; background:var(--g); color:#fff; cursor:pointer; text-align:center; display:inline-block; }
  button.light, .btn.light { background:var(--g2); color:var(--g); }
  button:disabled { opacity:.5; }
  input[type=file] { display:none; }
  textarea { width:100%; min-height:110px; font-size:32px; line-height:1.8; direction:rtl; text-align:right; border:2px solid var(--b); border-radius:12px; padding:10px; font-family: "Noto Naskh Arabic","Amiri","Geeza Pro","Traditional Arabic",serif; }
  textarea:focus { outline:none; border-color:var(--g); }
  .label { color:var(--m); font-size:15px; margin:0 0 8px; }
  #status { color:var(--g); font-size:16px; min-height:22px; margin-top:8px; }
  #translation { font-size:22px; min-height:30px; }
  #preview { max-width:100%; border-radius:12px; margin-top:12px; display:none; }
  .speed { display:flex; align-items:center; gap:10px; margin-top:12px; font-size:16px; color:var(--m); }
  .speed input { flex:1; }
  select { font-size:17px; padding:8px; border-radius:10px; border:1px solid var(--b); }
  .word { display:flex; align-items:center; gap:8px; border-bottom:1px solid var(--b); padding:10px 0; }
  .word:last-child { border-bottom:0; }
  .word .ar { font-size:26px; direction:rtl; font-family:"Noto Naskh Arabic","Amiri","Geeza Pro",serif; flex:1; text-align:right; }
  .word .tr { flex:1; font-size:16px; color:var(--m); }
  .word button { flex:0 0 auto; padding:10px 12px; font-size:18px; }
  .empty { color:var(--m); font-size:16px; }
  #words { display:flex; flex-wrap:wrap; gap:8px; direction:rtl; }
  .chip { flex:0 0 auto; background:var(--g2); color:var(--t); border:2px solid var(--b); border-radius:12px; padding:6px 14px; font-size:30px; font-weight:400; font-family:"Noto Naskh Arabic","Amiri","Geeza Pro","Traditional Arabic",serif; }
  .chip.on { border-color:var(--g); background:#cfe9e0; }
</style>
</head>
<body>
<header>📖 Арабский помощник</header>
<main>

  <div class="card">
    <p class="label">1. Сфотографируйте слово или текст</p>
    <div class="row">
      <label class="btn" for="cam">📷 Сфотографировать</label>
      <label class="btn light" for="gal">🖼 Из галереи</label>
    </div>
    <input id="cam" type="file" accept="image/*" capture="environment">
    <input id="gal" type="file" accept="image/*">
    <img id="preview" alt="">
    <div id="status"></div>
  </div>

  <div class="card">
    <p class="label">2. Проверьте текст (можно исправить или напечатать самой)</p>
    <textarea id="text" placeholder="اكتب هنا"></textarea>
    <p class="label" id="wordsLabel" style="margin-top:12px;display:none">Нажмите на слово, чтобы послушать его отдельно:</p>
    <div id="words"></div>
    <div class="row" style="margin-top:10px">
      <button id="speak">🔊 Послушать всё</button>
      <button id="translate" class="light">🌐 Перевести</button>
    </div>
    <div class="speed">🐢 <input id="rate" type="range" min="0.4" max="1.2" step="0.1" value="0.7"> 🐇</div>
  </div>

  <div class="card">
    <p class="label">Перевод на
      <select id="lang"><option value="uz">узбекский</option><option value="ru">русский</option></select>
    </p>
    <div id="translation"></div>
    <div class="row" style="margin-top:10px">
      <button id="save" class="light">⭐ Сохранить в мой словарь</button>
    </div>
  </div>

  <div class="card">
    <p class="label">⭐ Мой словарь</p>
    <div id="dict"></div>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const status = t => $('status').textContent = t;

// ---------- Распознавание с фото ----------
let worker = null;
async function getWorker() {
  if (!worker) {
    status('Загружаю распознавание арабского… (первый раз дольше)');
    worker = await Tesseract.createWorker('ara');
  }
  return worker;
}

function prepareImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const max = 1800;
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0, c.width, c.height);
      // чёрно-белое и контраст — помогает распознаванию
      const d = ctx.getImageData(0, 0, c.width, c.height), p = d.data;
      for (let i = 0; i < p.length; i += 4) {
        let g = 0.299*p[i] + 0.587*p[i+1] + 0.114*p[i+2];
        g = Math.max(0, Math.min(255, (g - 128) * 1.4 + 128));
        p[i] = p[i+1] = p[i+2] = g;
      }
      ctx.putImageData(d, 0, 0);
      resolve(c);
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}

async function onPhoto(e) {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  $('preview').src = URL.createObjectURL(file);
  $('preview').style.display = 'block';
  try {
    if (typeof Tesseract === 'undefined') throw new Error('нет интернета');
    const w = await getWorker();
    status('Читаю текст с фото…');
    const canvas = await prepareImage(file);
    const { data } = await w.recognize(canvas);
    const text = data.text.replace(/[^؀-ۿݐ-ݿ\s]/g, '').replace(/[ \t]+/g, ' ').trim();
    if (!text) { status('Не получилось прочитать. Сфотографируйте ближе и при хорошем свете.'); return; }
    $('text').value = text;
    renderWords();
    status('Готово ✔ Нажмите на слово или «Послушать всё».');
    translate();
  } catch (err) {
    status('Ошибка распознавания. Проверьте интернет и попробуйте ещё раз.');
  }
}
$('cam').addEventListener('change', onPhoto);
$('gal').addEventListener('change', onPhoto);

// ---------- Озвучка ----------
let arVoice = null;
function pickVoice() {
  const vs = speechSynthesis.getVoices();
  arVoice = vs.find(v => /^ar/i.test(v.lang)) || null;
}
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

// Голос через интернет (Google), работает без голосов в телефоне
let audioEl = null;
function speakOnline(text, rate) {
  if (audioEl) { audioEl.pause(); }
  const urls = [
    'https://translate.google.com/translate_tts?ie=UTF-8&tl=ar&client=tw-ob&q=',
    'https://translate.googleapis.com/translate_tts?ie=UTF-8&tl=ar&client=gtx&q='
  ];
  let i = 0;
  const tryNext = () => {
    if (i >= urls.length) {
      status('❗ Не удалось озвучить. Проверьте интернет и откройте программу в Chrome (не внутри Telegram).');
      return;
    }
    audioEl = new Audio(urls[i++] + encodeURIComponent(text.slice(0, 190)));
    audioEl.playbackRate = rate;
    audioEl.onerror = tryNext;
    audioEl.play().then(() => status('🔊')).catch(tryNext);
  };
  tryNext();
}

// Голос телефона; если не заговорил за 1.5 сек — переключаемся на голос через интернет
function speakDevice(text, rate) {
  return new Promise(resolve => {
    if (!('speechSynthesis' in window)) return resolve(false);
    let started = false;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    if (arVoice) u.voice = arVoice;
    u.lang = arVoice ? arVoice.lang : 'ar-SA';
    u.rate = rate;
    u.onstart = () => { started = true; resolve(true); };
    u.onerror = () => { if (!started) resolve(false); };
    speechSynthesis.speak(u);
    setTimeout(() => { if (!started) { speechSynthesis.cancel(); resolve(false); } }, 1500);
  });
}

let useOnline = false; // запоминаем, если голос телефона не работает
async function speak(text) {
  text = (text || '').trim();
  if (!text) return;
  const rate = parseFloat($('rate').value);
  if (!useOnline && arVoice) {
    const ok = await speakDevice(text, rate);
    if (ok) return;
    useOnline = true;
  }
  speakOnline(text, rate);
}
$('speak').onclick = () => speak($('text').value);

// ---------- Слова по отдельности ----------
function renderWords() {
  const box = $('words');
  box.innerHTML = '';
  const words = $('text').value.split(/[\s،؛؟.!,]+/).filter(Boolean);
  $('wordsLabel').style.display = words.length > 1 ? 'block' : 'none';
  if (words.length < 2) return;
  words.forEach(w => {
    const b = document.createElement('button');
    b.className = 'chip'; b.textContent = w;
    b.onclick = () => {
      document.querySelectorAll('.chip.on').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      speak(w);
    };
    box.append(b);
  });
}
$('text').addEventListener('input', renderWords);

// ---------- Перевод ----------
let lastTranslation = '';
async function translate() {
  const text = $('text').value.trim();
  if (!text) return;
  const tl = $('lang').value;
  $('translation').textContent = '…';
  try {
    const r = await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=ar&tl=' + tl + '&dt=t&q=' + encodeURIComponent(text));
    const j = await r.json();
    lastTranslation = j[0].map(x => x[0]).join('');
  } catch (e) {
    try {
      const r = await fetch('https://api.mymemory.translated.net/get?langpair=ar|' + tl + '&q=' + encodeURIComponent(text));
      const j = await r.json();
      lastTranslation = j.responseData.translatedText;
    } catch (e2) { lastTranslation = ''; }
  }
  $('translation').textContent = lastTranslation || 'Перевод недоступен (нет интернета).';
}
$('translate').onclick = translate;
$('lang').onchange = translate;

// ---------- Мой словарь ----------
function loadDict() { try { return JSON.parse(localStorage.getItem('arDict') || '[]'); } catch (e) { return []; } }
function saveDict(d) { try { localStorage.setItem('arDict', JSON.stringify(d)); } catch (e) {} }

function renderDict() {
  const d = loadDict(), box = $('dict');
  box.innerHTML = '';
  if (!d.length) { box.innerHTML = '<div class="empty">Пока пусто. Нажмите «Сохранить», чтобы добавить слово.</div>'; return; }
  d.forEach((w, i) => {
    const row = document.createElement('div'); row.className = 'word';
    const play = document.createElement('button'); play.textContent = '🔊'; play.onclick = () => speak(w.ar);
    const ar = document.createElement('div'); ar.className = 'ar'; ar.textContent = w.ar;
    const tr = document.createElement('div'); tr.className = 'tr'; tr.textContent = w.tr;
    const del = document.createElement('button'); del.className = 'light'; del.textContent = '✕';
    del.onclick = () => { if (confirm('Удалить это слово?')) { const x = loadDict(); x.splice(i, 1); saveDict(x); renderDict(); } };
    row.append(play, tr, ar, del);
    box.append(row);
  });
}
$('save').onclick = () => {
  const ar = $('text').value.trim();
  if (!ar) return;
  const d = loadDict();
  if (!d.some(w => w.ar === ar)) d.unshift({ ar, tr: lastTranslation });
  saveDict(d); renderDict();
  status('Сохранено в словарь ⭐');
};
renderDict();
</script>
</body>
</html>
